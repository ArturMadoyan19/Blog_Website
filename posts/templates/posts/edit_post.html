{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Posts</title>
    <link rel="stylesheet" href="{% static 'css/edit_post.css' %}">

</head>
<body>
<h2>Edit Post</h2>

{% if error %}
  <p style="color:red">{{ error }}</p>
{% endif %}

<form method="POST">
  {% csrf_token %}
  <input type="text" name="title" value="{{ post.title }}" required><br><br>
  <textarea name="text" rows="10" cols="65" required>{{ post.post }}</textarea><br><br>
  <button type="submit">Save Changes</button>
</form>

<a href="{% url 'post_ui' %}">Back to posts</a>

</body>
</html>
